name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

# Everything runs against the real target: Debian 13 (trixie).
jobs:
  check:
    name: validate theme + configs
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: install tooling
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends make python3 shellcheck

      # the semantic gates are hard errors: a bad selector, a nonexistent schema
      # key, a fake package name or a broken session file must never ship.
      - name: validate everything
        run: make check && make check-strict

      # style findings depend on the shellcheck version, so the blocking half is
      # limited to real errors and the advisory half is allowed to speak freely.
      - name: shellcheck (errors block)
        run: shellcheck -x -P SCRIPTDIR --severity=error scripts/*.sh scripts/lib/*.sh

      - name: shellcheck (warnings advisory)
        continue-on-error: true
        run: make lint-sh

      - name: profile is tab-shaped and parseable
        run: |
          python3 - <<'PY'
          import sys
          bad = []
          for i, raw in enumerate(open("config/gsettings/iris.gsettings", encoding="utf-8"), 1):
              line = raw.rstrip("\n")
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              if len(line.split("\t")) < 3:
                  bad.append(i)
          if bad:
              sys.exit(f"lines not in schema<TAB>key<TAB>value form: {bad}")
          print("profile format ok")
          PY

  roundtrip:
    name: install / uninstall round-trip
    runs-on: ubuntu-latest
    needs: check
    container:
      image: debian:trixie
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          ./scripts/install.sh --with-session --with-lightdm --force --yes
          test -f /usr/share/themes/Iris/cinnamon/cinnamon.css
          test -f /usr/share/themes/Iris/gtk-3.0/gtk.css
          test -f /usr/share/themes/Iris/gtk-4.0/gtk.css
          test -f /usr/share/themes/Iris/index.theme
          test ! -e /usr/share/themes/Iris/metacity-1
          test -f /usr/share/xsessions/iris.desktop
          test -f /usr/share/cinnamon-session/sessions/iris.session
          test -f /etc/lightdm/lightdm.conf.d/60-iris.conf
          test -f /var/lib/iris/manifest
          # the main lightdm config must be untouched by us
          ! grep -q "iris" /etc/lightdm/lightdm.conf 2>/dev/null

      - name: dry-run is inert
        run: |
          ./scripts/install.sh --with-session --force --yes --dry-run
          ./scripts/uninstall.sh --yes --dry-run
          test -f /usr/share/themes/Iris/cinnamon/cinnamon.css

      - name: uninstall restores everything
        run: |
          ./scripts/uninstall.sh --yes --restore-settings
          test ! -e /usr/share/themes/Iris
          test ! -e /usr/share/xsessions/iris.desktop
          test ! -e /usr/share/wayland-sessions/iris-wayland.desktop
          test ! -e /etc/lightdm/lightdm.conf.d/60-iris.conf
          test ! -e /usr/share/iris
          # a leftover non-empty tree would be a bug; the dir must be gone, not emptied
          test ! -e /usr/share/cinnamon-session/sessions

  package:
    name: build .deb
    runs-on: ubuntu-latest
    needs: check
    container:
      image: debian:trixie
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: install packaging tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential dpkg-dev debhelper devscripts make python3 lintian

      - name: build
        # The raw log lives on a host that headless/sandboxed clients cannot always
        # reach, so on failure the relevant lines are re-emitted as check-run
        # annotations, which the REST API does serve.
        run: |
          emit() { printf '::error::%s\n' "$(printf '%s' "$1" | sed 's/%/%25/g' | tr '\n\r' '| ' | cut -c1-300)"; }
          set +e
          dpkg-buildpackage -us -uc -b > /tmp/build.log 2>&1
          rc=$?
          set -e
          cat /tmp/build.log
          if [ "$rc" -eq 0 ]; then
            # dpkg-buildpackage drops the result next to the source tree, which is
            # outside the workspace and therefore unreachable for upload-artifact
            mkdir -p dist
            mv ../*.deb ../*.buildinfo ../*.changes dist/ 2>/dev/null || true
            ls -l dist
          fi
          if [ "$rc" -ne 0 ]; then
            for ln in $(seq 1 8); do
              line=$(grep -nE 'error|Error|warning: |dh_[a-z]+:' /tmp/build.log | tail -n 8 | sed -n "${ln}p")
              [ -n "$line" ] && emit "$line"
            done
            emit "TAIL: $(tail -n 6 /tmp/build.log | tr '\n' '|')"
            exit "$rc"
          fi

      - name: inspect + lint
        run: |
          # --force-depends: the container has no desktop installed, and pulling in
          # cinnamon just to satisfy Depends: would test nothing here.
          dpkg -i --force-depends dist/iris-theme_*.deb
          dpkg -L iris-theme | sed -n '1,40p'
          test -f /usr/share/themes/Iris/cinnamon/cinnamon.css
          test -f /usr/share/themes/Iris/gtk-3.0/gtk.css
          test -f /usr/share/themes/Iris/index.theme
          test -x /usr/bin/iris-apply-settings
          test ! -e /usr/bin/iris-install            # the side-effecting scripts stay out
          test ! -e /usr/share/themes/Iris/metacity-1
          lintian --no-tag-display-limit dist/iris-theme_*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: iris-theme-deb
          path: dist/*.deb
          if-no-files-found: error
